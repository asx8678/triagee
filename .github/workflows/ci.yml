name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      # Mirrors the documented local server (see the config/test.exs comment).
      # `trust` is what the test config connects with: it sets a username and
      # host but no password.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3.4.17"
          elixir-version: "1.20.4"

      - uses: actions/cache@v4
        with:
          path: app/deps
          key: deps-${{ runner.os }}-${{ hashFiles('app/mix.lock') }}

      - run: mix deps.get

      # Dialyzer's PLT lives in _build and takes minutes to build from scratch,
      # so it is cached with the compiled artifacts. The config is hashed too:
      # the standalone Tailwind CLI version is pinned in config/config.exs, so
      # a CLI bump alone must not restore a cache holding the previous binary.
      # A cold _build cache additionally downloads that pinned CLI from GitHub
      # releases, so the asset build needs network access on the first run
      # after a cache miss or a version bump.
      - uses: actions/cache@v4
        with:
          path: app/_build
          key: build-${{ runner.os }}-${{ hashFiles('app/mix.lock', 'app/config/config.exs') }}

      # `mix ci` is the non-mutating counterpart of `mix precommit`: it checks
      # formatting instead of rewriting it and checks for unused deps instead
      # of editing mix.lock, so a failure here is the tree's state and not a
      # silently fixed one. It runs the static analysis too: `credo --strict`
      # against .credo.exs and `dialyzer` against the same configuration.
      - run: mix ci

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: node --test test/workspace_hooks_test.cjs test/saved_queue_filters_test.cjs
      - run: sh scripts/verify_owned_db_test.sh
      - run: sh scripts/backup_restore_test.sh
